name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The contract the models are held to: Melete's own API description.
      - uses: actions/checkout@v4
        with:
          repository: Virel0/Melete
          path: melete
          sparse-checkout: src/api/openapi.json
          sparse-checkout-cone-mode: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Format
        run: |
          brew install swiftformat
          swiftformat --lint .

      - name: MeleteKit tests
        working-directory: MeleteKit
        env:
          MELETE_OPENAPI: ${{ github.workspace }}/melete/src/api/openapi.json
        run: swift test

  build:
    name: Build for tvOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('Mneme.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mneme.xcodeproj \
            -scheme Mneme \
            -destination 'generic/platform=tvOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
