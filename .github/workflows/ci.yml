name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a dependency or runner change that breaks the build shows
    # even in a quiet week.
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The contract the models are held to: Melete's own API description.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Virel0/Melete
          path: melete
          sparse-checkout: src/api/openapi.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      # One exact release, checked against its checksum: a newer SwiftFormat
      # brings new rules, and the check must not change under the code.
      - name: Format
        env:
          SWIFTFORMAT_VERSION: 0.63.1
          SWIFTFORMAT_SHA256: 385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb
        run: |
          curl -fsSL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  swiftformat.zip" | shasum -a 256 -c -
          unzip -q swiftformat.zip -d "$RUNNER_TEMP/swiftformat"
          "$RUNNER_TEMP/swiftformat/swiftformat" --lint .

      - name: MeleteKit tests
        working-directory: MeleteKit
        env:
          MELETE_OPENAPI: ${{ github.workspace }}/melete/src/api/openapi.json
        run: swift test

      - name: Size report
        run: python3 scripts/size_report.py .

  build:
    name: Build for tvOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-${{ hashFiles('Mneme.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Package.resolved is committed; the build uses exactly those versions.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mneme.xcodeproj \
            -scheme Mneme \
            -destination 'generic/platform=tvOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
